<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — FoodGrid AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/logo-icon.png" alt="FoodGrid AI">
      <div>
        <div class="brand-text" style="font-size:22px;">FoodGrid <span>AI</span></div>
        <div class="brand-tag">Rescue Today, Feed Tomorrow</div>
      </div>
    </div>

    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Join the global mission to reduce food waste</p>

    <form class="auth-form" onsubmit="return false;">
      <label>Full Name</label>
      <div class="input-with-icon">
        <span>👤</span>
        <input type="text" placeholder="Enter your full name">
      </div>

      <label>Email Address</label>
      <div class="input-with-icon">
        <span>✉️</span>
        <input type="email" placeholder="Enter your email address">
      </div>

      <label>Phone Number</label>
      <div class="phone-row">
        <button type="button" class="country-select" id="countrySelect">
          <span id="countryFlag">🇮🇳</span>
          <span id="countryDial">+91</span>
          <span class="chevron">▾</span>
        </button>
        <div class="input-with-icon" style="flex:1;">
          <span>📞</span>
          <input type="tel" placeholder="Enter your phone number">
        </div>
        <div class="country-dropdown" id="countryDropdown">
          <input type="text" id="countrySearch" placeholder="Search country...">
          <div class="country-list" id="countryList"></div>
        </div>
      </div>

      <label>Password</label>
      <div class="input-with-icon">
        <span>🔒</span>
        <input type="password" placeholder="Create a password" id="pw1">
        <button type="button" class="pw-toggle" data-target="pw1">👁️</button>
      </div>

      <label>Confirm Password</label>
      <div class="input-with-icon">
        <span>🔒</span>
        <input type="password" placeholder="Confirm your password" id="pw2">
        <button type="button" class="pw-toggle" data-target="pw2">👁️</button>
      </div>

      <label class="checkbox-row"><input type="checkbox"> I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>

      <button type="submit" class="btn-primary" style="width:100%;justify-content:center;font-size:14px;padding:15px;">Create Account</button>

      <div class="auth-divider"><span>or</span></div>

      <button type="button" class="btn-outline" style="width:100%;justify-content:center;font-size:14px;padding:15px;">✉ Sign up with Email</button>

      <p class="auth-footer-link">Already have an account? <a href="login.html">Log In</a></p>
    </form>
  </div>

<script src="countries.js"></script>
<script src="script.js"></script>
</body>
</html>
